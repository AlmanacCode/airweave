# Requires a dedicated namespace and verified CNI enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress
  namespace: REQUIRED_NAMESPACE
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-reviewed-dependency-callers
  namespace: REQUIRED_NAMESPACE
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: REQUIRED_APPLICATION_NAMESPACE
      podSelector:
        matchLabels:
          REQUIRED_CALLER_LABEL: REQUIRED_CALLER_VALUE
