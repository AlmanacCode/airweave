# REVIEW TEMPLATE: not apply-ready; see README gates.
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: REQUIRED_NAMESPACE
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
  - port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: REQUIRED_NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: redis
        image: docker.io/library/redis:7.4.11-alpine3.21@sha256:ca0acbb137c1dc3339c8b147a58fd6f42775d4599327b50e7b116c23de501af2
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 256Mi
        command:
        - sh
        - -ec
        args:
        - exec redis-server --appendonly yes --appendfsync everysec --requirepass
          "$REDIS_PASSWORD"
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: source-redis
              key: password
        volumeMounts:
        - name: data
          mountPath: /data
  serviceName: redis-headless
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: REQUIRED_STORAGE_CLASS
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: REQUIRED_NAMESPACE
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
  - name: service
    port: 6379
    targetPort: 6379
---
