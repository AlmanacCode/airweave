query OwnedLinearIssueAttachments($issueId: String!, $first: Int!, $after: String) {
  issue(id: $issueId) {
    id team { id }
    attachments(first: $first, after: $after, includeArchived: true, orderBy: createdAt) {
      nodes { id title url metadata createdAt updatedAt archivedAt issue { id } }
      pageInfo { hasNextPage endCursor }
    }
  }
}
